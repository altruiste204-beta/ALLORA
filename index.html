    <meta property="og:title" content="ALLORA — Connectés pour servir" />
    <meta property="og:description" content="Plateforme de coopération chrétienne : entraide, partage de ressources, événements et collaborations inter-églises." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
      @keyframes allora-badge-cycle {
        0%, 28% {
          background-color: #111315;
          border-color: rgba(255, 255, 255, 0.25);
          box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        34%, 62% {
          background-color: #19344A;
          border-color: rgba(103, 183, 232, 0.5);
          box-shadow: 0 16px 44px rgba(103, 183, 232, 0.4), 0 0 0 1px rgba(103, 183, 232, 0.2);
        }
        68%, 94% {
          background-color: #FFFFFF;
          border-color: rgba(17, 19, 21, 0.15);
          box-shadow: 0 16px 40px rgba(255, 255, 255, 0.35), 0 0 0 1px rgba(17, 19, 21, 0.08);
        }
        100% {
          background-color: #111315;
          border-color: rgba(255, 255, 255, 0.25);
          box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
      }

      @keyframes allora-symbol-cycle {
        0%, 28% {
          fill: #FFFFFF;
          stroke: #FFFFFF;
          filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6));
        }
        34%, 62% {
          fill: #67B7E8;
          stroke: #67B7E8;
          filter: drop-shadow(0 0 14px rgba(103, 183, 232, 0.7));
        }
        68%, 94% {
          fill: #111315;
          stroke: #111315;
          filter: drop-shadow(0 0 8px rgba(17, 19, 21, 0.3));
        }
        100% {
          fill: #FFFFFF;
          stroke: #FFFFFF;
          filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6));
        }
      }

      @keyframes allora-badge-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }

      @keyframes allora-aura-spin {
        0% { transform: rotate(0deg) scale(0.95); opacity: 0.4; }
        50% { transform: rotate(180deg) scale(1.15); opacity: 0.75; }
        100% { transform: rotate(360deg) scale(0.95); opacity: 0.4; }
      }

      .loading-container {
        position: fixed;
        inset: 0;
        background: #19344A;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      .aura-glow {
        position: absolute;
        width: 380px;
        height: 380px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(103, 183, 232, 0.35) 0%, rgba(220, 239, 250, 0.12) 45%, rgba(25, 52, 74, 0) 70%);
        animation: allora-aura-spin 5s ease-in-out infinite;
        pointer-events: none;
      }

      .logo-box {
        width: 84px;
        height: 84px;
        border-radius: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        position: relative;
        z-index: 1;
        box-sizing: border-box;
        border-width: 1px;
        border-style: solid;
        animation: allora-badge-cycle 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite, allora-badge-pulse 2.25s ease-in-out infinite;
      }

      .logo-svg {
        width: 100%;
        height: 100%;
        display: block;
        animation: allora-symbol-cycle 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .brand-title {
        margin-top: 24px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: #FFFFFF;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .brand-subtitle {
        margin-top: 6px;
        font-size: 11px;
        font-weight: 600;
        color: #DCEFFA;
        opacity: 0.9;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
